<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  LampRead
  v0.4.2  Bookshelf shows book covers (horizontal titles, chapter count) instead of spines.
  v0.4.1  Day reading on a sand-coloured background (status bar follows).
  v0.4    Books have chapters: import several files as one book, chapter list, next-chapter button,
          export a chapter or the whole book. Old books migrate to one-chapter books automatically.
  v0.3.2  Icon linked as a real file, apple-touch-icon.png (keep it next to index.html).
  v0.3.1  Home-screen icon as PNG (iOS ignores SVG icons).
  v0.3  Reading tools panel: text size (smaller/larger) and day/night moved into the bottom dock.
        Dock has a full-width hide bar, so it is hard to miss and never marks the text by accident.
  v0.2  Bookcase landing page with lamp-light logo. Marking tools only in the reader, collapsible.
        Marks exported as CriticMarkup (tag + note), version tracking, file renamed index.html.
        Import is a plus slot on the shelf; export lives inside the book menu. Slogan: Stories by dad.
  v0.1  Reader with word/sentence/paragraph marks, markdown import/export, backup.
-->
<meta name="application-name" content="LampRead">
<meta name="version" content="0.4.2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LampRead">
<meta name="theme-color" content="#14151c">
<title>LampRead — stories by dad</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
:root{
  --ink:#14151c;
  --ink-2:#1c1e27;
  --ink-3:#272a35;
  --paper:#f7f2e7;
  --text:#ece5d5;
  --muted:#8f8a79;
  --line:#2e313d;
  --amber:#e9b44c;
  --teal:#5fb3a1;
  --rose:#d96a78;
  --bg:var(--ink);
  --surface:var(--ink-2);
  --surface-2:var(--ink-3);
  --fg:var(--text);
  --dim:var(--muted);
  --rule:var(--line);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --read:20px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="day"]{
  --bg:#ede2c9;
  --surface:#f6eddb;
  --surface-2:#e0d3b5;
  --fg:#1e1f26;
  --dim:#655c46;
  --rule:#d2c4a3;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--ui);
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.app{display:flex;flex-direction:column;height:100dvh}

/* ---------- top bar ---------- */
.bar{
  display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-t) + 10px) 14px 10px;
  border-bottom:1px solid var(--rule);background:var(--bg);
  position:sticky;top:0;z-index:20;
}
.bar h1{
  font-family:var(--serif);font-size:19px;font-weight:600;margin:0;
  letter-spacing:.2px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.iconbtn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:var(--fg);flex:0 0 auto;
}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.iconbtn[disabled]{opacity:.3}

/* ---------- scroll body ---------- */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:18px 20px calc(var(--safe-b) + 40px)}

/* ---------- library ---------- */
.lampmark{
  font-family:var(--serif);font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--dim);margin:6px 0 20px;
}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.empty{
  border:1px dashed var(--rule);border-radius:16px;padding:34px 24px;text-align:center;color:var(--dim);
}
.empty p{margin:0 0 6px;font-family:var(--serif);font-size:17px;color:var(--fg)}
.empty span{font-size:13.5px;line-height:1.5;display:block}
.rowbtns{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{
  border:1px solid var(--rule);border-radius:11px;padding:11px 15px;font-size:14.5px;
  background:var(--surface);display:inline-flex;align-items:center;gap:8px;
}
.btn:active{background:var(--surface-2)}
.btn.primary{background:var(--amber);color:#191a12;border-color:transparent;font-weight:600}
.btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- reader ---------- */
.page{
  font-family:var(--serif);font-size:var(--read);line-height:1.72;
  padding:14px 20px calc(var(--safe-b) + 250px);
  max-width:44rem;margin:0 auto;
}
.page h1,.page h2,.page h3{line-height:1.22;margin:1.6em 0 .5em;font-weight:600}
.page h1{font-size:1.5em;margin-top:.4em}
.page h2{font-size:1.24em}
.page h3{font-size:1.08em;font-style:italic;font-weight:500}
.page p{margin:0 0 1.05em}
.page li{margin:0 0 .5em}
.page ul,.page ol{margin:0 0 1.05em;padding-left:1.3em}
.page blockquote{
  margin:0 0 1.05em;padding-left:14px;border-left:2px solid var(--amber);
  font-style:italic;color:var(--dim)
}
.page hr{border:0;border-top:1px solid var(--rule);margin:1.8em 0}
.w{cursor:pointer;border-radius:4px;padding:1px 0}
.w.b{font-weight:700}
.w.i{font-style:italic}
.w.c{font-family:ui-monospace,Menlo,monospace;font-size:.9em}

/* the signature: a marker swipe that sits behind the words */
.w.hl{
  background:var(--mk);
  box-shadow:0 0 0 2px var(--mk);
  color:var(--mkfg);
}
.w.hl.revisit{--mk:rgba(233,180,76,.9);--mkfg:#191a12}
.w.hl.word{--mk:rgba(95,179,161,.9);--mkfg:#0f1a17}
.w.hl.loved{--mk:rgba(217,106,120,.9);--mkfg:#1d0f12}
.w.hl.st{border-top-left-radius:9px;border-bottom-left-radius:9px;box-shadow:-3px 0 0 3px var(--mk),0 0 0 2px var(--mk)}
.w.hl.en{border-top-right-radius:9px;border-bottom-right-radius:9px;box-shadow:3px 0 0 3px var(--mk),0 0 0 2px var(--mk)}
.w.hl.st.en{box-shadow:0 0 0 3px var(--mk)}
.w.hl.noted{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.w.flash{animation:flash .9s ease}
@keyframes flash{0%,100%{outline-color:transparent}30%,70%{outline:2px solid var(--amber);outline-offset:3px}}

/* ---------- reader dock ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:0 12px calc(var(--safe-b) + 12px);
  border-radius:18px 18px 0 0;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--rule);
  display:flex;flex-direction:column;gap:9px;
}
.seg{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{
  flex:1;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--dim);
}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.pens{display:flex;gap:9px;align-items:center}
.pen{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 6px;border-radius:11px;border:1px solid var(--rule);font-size:12.5px;color:var(--dim);
}
.pen .swatch{width:13px;height:13px;border-radius:4px}
.pen[aria-pressed="true"]{color:var(--fg);border-color:transparent;background:var(--surface-2);font-weight:600}
.pen[aria-pressed="true"] .swatch{box-shadow:0 0 0 3px color-mix(in srgb,var(--bg) 60%,transparent)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--surface);border-radius:20px 20px 0 0;
  padding:8px 18px calc(var(--safe-b) + 18px);
  transform:translateY(110%);transition:transform .24s cubic-bezier(.32,.72,0,1);
  max-height:82dvh;overflow-y:auto;border-top:1px solid var(--rule);
}
.sheet.on{transform:translateY(0)}
.grip{width:38px;height:4px;border-radius:2px;background:var(--rule);margin:6px auto 14px}
.sheet h2{font-family:var(--serif);font-size:18px;margin:0 0 4px;font-weight:600}
.sheet .quote{
  font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--fg);
  border-left:2px solid var(--amber);padding-left:12px;margin:12px 0 16px;
}
.field{width:100%;background:var(--bg);border:1px solid var(--rule);border-radius:11px;
  padding:12px;font-size:16px;font-family:var(--ui);resize:vertical}
.field:focus{outline:2px solid var(--amber);outline-offset:0;border-color:transparent}
.sheetrow{display:flex;gap:9px;margin-top:14px}
.sheetrow .btn{flex:1;justify-content:center}
.danger{color:var(--rose)}
.menu{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.menu button{
  display:flex;align-items:center;gap:13px;padding:14px 6px;text-align:left;
  border-bottom:1px solid var(--rule);font-size:15.5px;
}
.menu button:last-child{border-bottom:0}
.menu button svg{width:19px;height:19px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:var(--dim)}
.menu button small{display:block;color:var(--dim);font-size:12.5px;margin-top:2px;font-weight:400}

/* ---------- marks list ---------- */
.marks{display:flex;flex-direction:column;gap:1px;background:var(--rule);border-radius:14px;overflow:hidden}
.mark{background:var(--bg);padding:14px 15px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.mark:active{background:var(--surface)}
.mark .bar-l{width:3px;align-self:stretch;border-radius:2px;flex:0 0 auto;min-height:34px}
.mark .txt{font-family:var(--serif);font-size:16px;line-height:1.5}
.mark .note{font-size:13px;color:var(--dim);margin-top:5px;line-height:1.45}
.tally{display:flex;gap:14px;margin:0 0 16px;font-size:13px;color:var(--dim);flex-wrap:wrap}
.tally span{display:flex;align-items:center;gap:6px}

/* ---------- editor ---------- */
.editor{
  width:100%;height:100%;min-height:60dvh;background:var(--bg);border:0;padding:16px 20px;
  font-family:ui-monospace,Menlo,monospace;font-size:16px;line-height:1.62;resize:none;
}
.editor:focus{outline:none}
.hint{font-size:12.5px;color:var(--dim);padding:0 20px 10px;line-height:1.5}
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(var(--safe-b) + 26px);z-index:80;
  background:var(--surface-2);color:var(--fg);border:1px solid var(--rule);
  padding:11px 17px;border-radius:12px;font-size:14px;opacity:0;transition:all .22s;
  pointer-events:none;max-width:86vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.35)
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- landing: the bookcase ---------- */
.hero{position:relative;text-align:center;padding:calc(var(--safe-t) + 10px) 0 0}
.hero svg{width:min(60vw,220px);height:auto;display:block;margin:0 auto}
.hero .wm{position:absolute;left:0;right:0;bottom:46px;font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.04em}
.hero .wm i{font-style:normal;color:var(--amber)}
.hero .tg{position:absolute;left:0;right:0;bottom:24px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.case{max-width:30rem;margin:-4px auto 0;padding:0 12px;position:relative}
.case::before{content:"";position:absolute;inset:0 0 auto;height:280px;background:radial-gradient(ellipse at 50% 0,rgba(233,180,76,.17),transparent 70%);pointer-events:none}
.row{position:relative;display:flex;align-items:flex-end;gap:10px;min-height:176px;padding:14px 12px 0;box-shadow:inset 0 16px 18px -16px rgba(0,0,0,.4)}
.plank{height:13px;border-radius:2px;background:linear-gradient(#8f6e45,#5b4328);box-shadow:0 7px 14px rgba(0,0,0,.35);margin-bottom:4px}
.sp{position:relative;flex:0 0 calc((100% - 20px)/3);aspect-ratio:5/7;border-radius:3px 7px 7px 3px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;padding:13px 9px 11px 15px;
  background:linear-gradient(90deg,rgba(0,0,0,.38) 0,rgba(255,255,255,.1) 5%,rgba(0,0,0,.2) 7%,transparent 12%),linear-gradient(180deg,rgba(255,255,255,.07),transparent 40%),var(--bg2);
  color:var(--fg2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07),0 6px 10px rgba(0,0,0,.3);transition:transform .15s;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
.sp:active{transform:translateY(-5px)}
.sp .st{font-family:var(--serif);font-size:14.5px;line-height:1.22;font-weight:600;letter-spacing:.01em;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.sp .mt{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.7;min-height:12px}
.sp .pip{position:absolute;top:10px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.chlist{display:flex;flex-direction:column;gap:8px;max-width:30rem;margin:0 auto}
.chrow{display:flex;align-items:stretch;gap:6px}
.chmain{flex:1;display:flex;align-items:center;gap:12px;padding:15px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);text-align:left}
.chmain:active{background:var(--surface-2)}
.chn{color:var(--amber);font-family:var(--serif);width:22px}
.cht{flex:1;font-family:var(--serif);font-size:16px}
.pip2{width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.chmv{width:42px;border:1px solid var(--rule);border-radius:12px;color:var(--dim)}
.chmv:disabled{opacity:.3}
.chadd{justify-content:center;align-items:center;padding:15px;border:1.5px dashed var(--dim);border-radius:12px;color:var(--dim);font-size:14px}
.chnav{display:flex;justify-content:center;padding:34px 0 8px}
.slot{justify-content:center;align-items:center;flex-direction:column;gap:9px;background:none!important;border:1.5px dashed var(--dim);border-radius:6px;color:var(--dim);box-shadow:none;padding:0 4px}
.slot .plus{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(233,180,76,.16)}
.slot .plus svg{width:18px;height:18px;stroke:var(--amber);fill:none;stroke-width:2;stroke-linecap:round}
.slot span{font-size:11px;letter-spacing:.04em;line-height:1.2;text-align:center}
.ver{text-align:center;font-size:11px;letter-spacing:.16em;color:var(--dim);opacity:.7;margin:22px 0 0;padding-bottom:calc(var(--safe-b) + 28px)}
.dockhead{margin:0 -12px;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--dim);font-size:12.5px;letter-spacing:.06em}
.dockhead:active{color:var(--fg)}
.dockhead svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.readrow{display:flex;gap:9px}
.stepper{flex:1.5;display:flex;align-items:center;background:var(--surface-2);border-radius:11px;padding:3px}
.stepper button{flex:1;height:38px;border-radius:8px;color:var(--fg);font-family:var(--serif)}
.stepper button:active{background:var(--bg)}
.stepper .val{min-width:38px;text-align:center;font-size:12.5px;color:var(--dim)}
.daynight{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;height:44px;border-radius:11px;border:1px solid var(--rule);font-size:13px}
.daynight svg{width:18px;height:18px;stroke:var(--amber);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dockfab{position:fixed;right:14px;bottom:calc(var(--safe-b) + 14px);z-index:30;width:54px;height:54px;border-radius:50%;
  display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--rule);box-shadow:0 6px 20px rgba(0,0,0,.35)}
.dockfab svg{width:21px;height:21px;stroke:var(--amber);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="iconbtn" id="navBtn" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h1 id="title">LampRead</h1>
    <button class="iconbtn" id="marksBtn" aria-label="Marks">
      <svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg>
    </button>
    <button class="iconbtn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg>
    </button>
  </div>
  <div class="body" id="body"></div>
  <div class="dock" id="dock" hidden>
    <button class="dockhead" id="dockHide" aria-label="Hide tools"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>Hide tools</button>
    <div class="seg" role="group" aria-label="What a tap marks">
      <button data-mode="word" aria-pressed="true">Word</button>
      <button data-mode="sentence" aria-pressed="false">Sentence</button>
      <button data-mode="para" aria-pressed="false">Paragraph</button>
    </div>
    <div class="pens" role="group" aria-label="Mark colour">
      <button class="pen" data-tag="revisit" aria-pressed="true"><i class="swatch" style="background:var(--amber)"></i>Revisit</button>
      <button class="pen" data-tag="word" aria-pressed="false"><i class="swatch" style="background:var(--teal)"></i>Explain</button>
      <button class="pen" data-tag="loved" aria-pressed="false"><i class="swatch" style="background:var(--rose)"></i>Loved</button>
    </div>
    <div class="readrow" role="group" aria-label="Reading">
      <div class="stepper">
        <button id="szDown" aria-label="Smaller text" style="font-size:14px">A−</button>
        <span class="val" id="szVal"></span>
        <button id="szUp" aria-label="Larger text" style="font-size:21px">A+</button>
      </div>
      <button class="daynight" id="themeBtn" aria-label="Switch day and night reading"></button>
    </div>
  </div>
</div>
<button class="dockfab" id="dockShow" aria-label="Show marking tools" hidden><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".md,.markdown,.txt,.json" multiple hidden>

<script>
"use strict";

/* ============================================================
   storage — window.storage inside Claude, localStorage on your
   own phone/host. Same API either way.
   ============================================================ */
const KEY = "lamp.v1";
const VERSION = "0.4.2";
const Store = {
  async get(k){
    if (typeof window.storage !== "undefined" && window.storage) {
      try { const r = await window.storage.get(k, false); return r ? r.value : null; }
      catch(e){ return null; }
    }
    try { return localStorage.getItem(k); } catch(e){ return null; }
  },
  async set(k,v){
    if (typeof window.storage !== "undefined" && window.storage) {
      try { await window.storage.set(k, v, false); return true; } catch(e){ return false; }
    }
    try { localStorage.setItem(k,v); return true; } catch(e){ return false; }
  }
};

let DB = { books: [], settings:{ theme:"night", read:20, mode:"word", tag:"revisit" } };
let view = "library";        // library | reader | editor | marks
let bookId = null, chapterId = null, importInto = null;
let parsed = null;           // { blocks:[{type,words:[...]}] } for the open book
const TAGS = { revisit:{label:"Revisit", css:"var(--amber)"},
               word:{label:"Explain", css:"var(--teal)"},
               loved:{label:"Loved", css:"var(--rose)"} };

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function save(){ DB.appVersion = VERSION; await Store.set(KEY, JSON.stringify(DB)); }
function pbook(){ return DB.books.find(b => b.id === bookId) || null; }
function book(){ const b = pbook(); return b ? (b.chapters.find(c => c.id === chapterId) || b.chapters[0]) : null; }   // the active chapter
function normalizeBooks(){
  DB.books.forEach(b => {
    if (b.chapters) return;
    b.chapters = [{ id: uid(), title: b.title, source: b.source || "", highlights: b.highlights || [], created: b.created, updated: b.updated }];
    delete b.source; delete b.highlights;
  });
}
function guessTitle(names, fallback){
  let p = names[0]; names.forEach(n => { while (!n.startsWith(p)) p = p.slice(0, -1); });
  p = p.replace(/[\s\-_.:,]*(kapitel|chapter|del|part|afsnit)?[\s\-_.:,\d]*$/i, "").trim();
  return p.length > 1 ? p : fallback;
}
function bookWithMarks(pb){
  return LAMP_NOTE + pb.chapters.map(c => {
    const t = withMarks(c).slice(LAMP_NOTE.length);
    return /^\s*#\s/.test(c.source) ? t : `# ${c.title}\n\n${t}`;
  }).join("\n\n");
}

/* ============================================================
   markdown → blocks → words (with char offsets back into source)
   ============================================================ */
function splitBlocks(src){
  const lines = src.replace(/\r\n?/g,"\n").split("\n");
  const starts = []; let o = 0;
  for (const l of lines){ starts.push(o); o += l.length + 1; }
  const blocks = [];
  const isBreak = l => !l.trim()
    || /^#{1,6}\s/.test(l) || /^>/.test(l)
    || /^\s*([-*+]|\d+[.)])\s/.test(l) || /^(\*\*\*|---|___)\s*$/.test(l);
  let i = 0;
  while (i < lines.length){
    const line = lines[i], st = starts[i];
    if (!line.trim()){ i++; continue; }
    let m;
    if ((m = /^(#{1,6})\s+/.exec(line))){
      blocks.push({ type:"h"+m[1].length, raw:line.slice(m[0].length), off:st+m[0].length }); i++; continue;
    }
    if (/^(\*\*\*|---|___)\s*$/.test(line)){ blocks.push({ type:"hr", raw:"", off:st }); i++; continue; }
    if ((m = /^>\s?/.exec(line))){
      blocks.push({ type:"quote", raw:line.slice(m[0].length), off:st+m[0].length }); i++; continue;
    }
    if ((m = /^(\s*)([-*+]|\d+[.)])\s+/.exec(line))){
      blocks.push({ type:"li", ordered:/\d/.test(m[2]), raw:line.slice(m[0].length), off:st+m[0].length }); i++; continue;
    }
    let j = i + 1;
    while (j < lines.length && !isBreak(lines[j])) j++;
    const end = starts[j-1] + lines[j-1].length;
    blocks.push({ type:"p", raw: src.slice(st, end), off: st });
    i = j;
  }
  return blocks;
}

function tokenize(raw, off){
  const words = [];
  let b = false, it = false, code = false, cur = null;
  const flush = () => { if (cur){ words.push(cur); cur = null; } };
  const push = (ch, idx) => {
    if (!cur) cur = { text:"", s: off+idx, e: off+idx+1, b, i:it, c:code };
    cur.text += ch; cur.e = off + idx + 1;
  };
  let k = 0;
  const bound = i => (i <= 0 || /[\s("'\u2018\u201c]/.test(raw[i-1]));
  while (k < raw.length){
    const ch = raw[k];
    if (ch === "\\" && k+1 < raw.length){ push(raw[k+1], k+1); k += 2; continue; }
    if (ch === "*" || ch === "_"){
      let n = 0; while (raw[k+n] === ch) n++;
      if (ch === "_" && !bound(k) && !/[\s.,!?;:)\u2019\u201d]|^$/.test(raw[k+n] || "")){ push(ch,k); k++; continue; }
      if (n >= 2){ b = !b; k += 2; if (n === 3){ it = !it; k += 1; } continue; }
      it = !it; k += 1; continue;
    }
    if (ch === "`"){ code = !code; k++; continue; }
    if (ch === "=" && raw[k+1] === "="){ k += 2; continue; }
    if (/\s/.test(ch)){ flush(); k++; continue; }
    push(ch, k); k++;
  }
  flush();
  let sent = 0;
  for (const w of words){
    w.sent = sent;
    if (/[.!?\u2026][")'\u2019\u201d\]]*$/.test(w.text)) sent++;
  }
  return words;
}

function parse(src){
  const blocks = splitBlocks(src);
  for (const bl of blocks) bl.words = bl.type === "hr" ? [] : tokenize(bl.raw, bl.off);
  return { blocks, src };
}

/* pull ==marks== out of a source file → clean source + highlight ranges */
function extractMarks(src){
  // accept suggestions an editor or Claude may have made, drop the header comment
  src = src.replace(/<!--\s*LampRead[\s\S]*?-->\s*/i, "")
    .replace(/\{\+\+([\s\S]*?)\+\+\}/g, "$1").replace(/\{--[\s\S]*?--\}/g, "")
    .replace(/\{~~[\s\S]*?~>([\s\S]*?)~~\}/g, "$1");
  const re = /\{==([\s\S]*?)==\}(?:\{>>([\s\S]*?)<<\})?|==([^=\s][\s\S]*?)==|\{>>[\s\S]*?<<\}/g;
  let clean = "", last = 0, m; const ranges = [];
  while ((m = re.exec(src))){
    clean += src.slice(last, m.index); last = re.lastIndex;
    const txt = m[1] !== undefined ? m[1] : m[3];
    if (txt === undefined) continue;                // stray comment: dropped
    const s0 = clean.length; clean += txt;
    let tag = "revisit", note = (m[2]||"").trim();
    const t = /^\[(revisit|explain|loved)\]\s*/i.exec(note);
    if (t){ tag = t[1].toLowerCase() === "explain" ? "word" : t[1].toLowerCase(); note = note.slice(t[0].length); }
    ranges.push({ s: s0, e: clean.length, tag, note });
  }
  return { clean: clean + src.slice(last), ranges };
}

function rangesToHighlights(doc, ranges, tag){
  const out = [];
  ranges.forEach(r => {
    doc.blocks.forEach((bl, bi) => {
      let s = -1, e = -1;
      bl.words.forEach((w, wi) => {
        if (w.e > r.s && w.s < r.e){ if (s < 0) s = wi; e = wi; }
      });
      if (s >= 0) out.push({ id:uid(), b:bi, s, e, tag: r.tag||tag||"revisit", note: r.note||"",
                             text: bl.words.slice(s, e+1).map(w=>w.text).join(" ") });
    });
  });
  return out;
}

/* ============================================================
   render: reader
   ============================================================ */
const TAGCLASS = { revisit:"revisit", word:"word", loved:"loved" };

function renderPage(){
  const bk = book(); if (!bk) return "";
  parsed = parse(bk.source);
  const hlByBlock = {};
  (bk.highlights||[]).forEach(h => { (hlByBlock[h.b] = hlByBlock[h.b] || []).push(h); });

  let html = '<div class="page" id="page">';
  let listOpen = null;
  parsed.blocks.forEach((bl, bi) => {
    if (bl.type === "li" && listOpen === null){ listOpen = bl.ordered ? "ol" : "ul"; html += `<${listOpen}>`; }
    if (bl.type !== "li" && listOpen){ html += `</${listOpen}>`; listOpen = null; }

    if (bl.type === "hr"){ html += "<hr>"; return; }
    const inner = bl.words.map((w, wi) => {
      const cls = ["w"];
      if (w.b) cls.push("b"); if (w.i) cls.push("i"); if (w.c) cls.push("c");
      let hid = "";
      const h = (hlByBlock[bi]||[]).find(x => wi >= x.s && wi <= x.e);
      if (h){
        cls.push("hl", TAGCLASS[h.tag] || "revisit");
        if (wi === h.s) cls.push("st");
        if (wi === h.e) cls.push("en");
        if (h.note) cls.push("noted");
        hid = ` data-h="${h.id}"`;
      }
      return `<span class="${cls.join(" ")}" data-b="${bi}" data-w="${wi}" data-s="${w.sent}"${hid}>${esc(w.text)}</span>`;
    }).join(" ");

    const tag = bl.type === "p" ? "p"
      : bl.type === "quote" ? "blockquote"
      : bl.type === "li" ? "li"
      : bl.type.startsWith("h") ? "h" + Math.min(3, +bl.type.slice(1)) : "p";
    html += `<${tag}>${inner}</${tag}>`;
  });
  if (listOpen) html += `</${listOpen}>`;
  return html + "</div>";
}

/* ============================================================
   highlight actions
   ============================================================ */
function rangeFor(bi, wi, sent){
  const mode = DB.settings.mode, bl = parsed.blocks[bi];
  if (mode === "para") return [0, bl.words.length - 1];
  if (mode === "sentence"){
    let s = wi, e = wi;
    bl.words.forEach((w, i) => { if (w.sent === sent){ if (i < s) s = i; if (i > e) e = i; } });
    return [s, e];
  }
  return [wi, wi];
}

function addMark(bi, wi, sent){
  const bk = book();
  const [s, e] = rangeFor(bi, wi, sent);
  bk.highlights = (bk.highlights||[]).filter(h => !(h.b === bi && h.s <= e && h.e >= s));
  bk.highlights.push({
    id: uid(), b: bi, s, e, tag: DB.settings.tag, note: "",
    text: parsed.blocks[bi].words.slice(s, e+1).map(w => w.text).join(" ")
  });
  bk.updated = Date.now();
  save(); draw();
}

function markSheet(hid){
  const bk = book(); const h = bk.highlights.find(x => x.id === hid); if (!h) return;
  openSheet(`
    <h2>Mark</h2>
    <div class="quote">${esc(h.text)}</div>
    <div class="pens" style="margin-bottom:12px">
      ${Object.entries(TAGS).map(([k,v]) => `
        <button class="pen" data-settag="${k}" aria-pressed="${h.tag===k}">
          <i class="swatch" style="background:${v.css}"></i>${v.label}</button>`).join("")}
    </div>
    <textarea class="field" id="noteField" rows="3" placeholder="Why revisit this? (optional)">${esc(h.note||"")}</textarea>
    <div class="sheetrow">
      <button class="btn danger" id="delMark">Remove mark</button>
      <button class="btn primary" id="saveMark">Save</button>
    </div>`);
  $("#sheet").querySelectorAll("[data-settag]").forEach(b => b.onclick = () => {
    h.tag = b.dataset.settag;
    $("#sheet").querySelectorAll("[data-settag]").forEach(x =>
      x.setAttribute("aria-pressed", x.dataset.settag === h.tag));
  });
  $("#delMark").onclick = () => {
    bk.highlights = bk.highlights.filter(x => x.id !== hid);
    bk.updated = Date.now(); save(); closeSheet(); draw(); toast("Mark removed");
  };
  $("#saveMark").onclick = () => {
    h.note = $("#noteField").value.trim();
    bk.updated = Date.now(); save(); closeSheet(); draw();
  };
}

/* ============================================================
   export / import
   ============================================================ */
const LAMP_NOTE = "<!-- LampRead: {==text==}{>>[tag] note<<} marks a passage the reader flagged (CriticMarkup). Tags: revisit = rework or reconsider, explain = clarify or simplify, loved = keep as is. To apply: revise each marked passage following its note, remove all markup and this comment, and return the clean markdown. -->\n\n";
function withMarks(bk){
  const doc = parse(bk.source);
  const cuts = [];
  (bk.highlights||[]).forEach(h => {
    const bl = doc.blocks[h.b]; if (!bl || !bl.words[h.s] || !bl.words[h.e]) return;
    const label = (TAGS[h.tag] ? TAGS[h.tag].label : h.tag).toLowerCase();
    const note = (h.note||"").replace(/\s*\n\s*/g," ").replace(/<<\}/g,"<< }");
    let a = bl.words[h.s].s, z = bl.words[h.e].e, a2 = a, z2 = z;   // keep *emphasis* pairs intact
    while (a2 > 0 && /[*_`]/.test(bk.source[a2-1])) a2--;
    while (/[*_`]/.test(bk.source[z2] || "")) z2++;
    const seg = bk.source.slice(a2, z2);
    if (!((seg.match(/\*/g)||[]).length % 2) && !((seg.match(/`/g)||[]).length % 2)){ a = a2; z = z2; }
    cuts.push({ at: a, ins: "{==" },
               { at: z, ins: `==}{>>[${label}]${note ? " " + note : ""}<<}` });
  });
  cuts.sort((a,b) => b.at - a.at);
  let out = bk.source;
  cuts.forEach(c => { out = out.slice(0, c.at) + c.ins + out.slice(c.at); });
  return LAMP_NOTE + out;
}

function marksDoc(bk){
  const lines = [`# ${bk.title} — marks`, ""];
  const order = [...(bk.highlights||[])].sort((a,b) => a.b - b.b || a.s - b.s);
  if (!order.length) lines.push("_No marks yet._");
  order.forEach(h => {
    lines.push(`- **${TAGS[h.tag] ? TAGS[h.tag].label : h.tag}** — “${h.text}”`);
    if (h.note) lines.push(`  - ${h.note}`);
  });
  return lines.join("\n") + "\n";
}

function slug(s){ return (s||"book").toLowerCase().replace(/[^a-z0-9\u00e6\u00f8\u00e5]+/gi,"-").replace(/^-|-$/g,"").slice(0,50) || "book"; }

async function deliver(name, text, mime){
  const file = new File([text], name, { type: mime || "text/markdown" });
  if (navigator.canShare && navigator.canShare({ files:[file] })){
    try { await navigator.share({ files:[file], title:name }); return; } catch(e){ if (e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast("Saved to Files / Downloads");
}

function importFiles(list){
  const target = importInto; importInto = null;
  const files = [...list].sort((a,b) => a.name.localeCompare(b.name, undefined, { numeric:true }));
  Promise.all(files.map(f => f.text().then(txt => ({ name:f.name, txt })))).then(items => {
    const chapters = [], names = [];
    items.forEach(({ name, txt }) => {
      if (name.endsWith(".json")){
        try {
          const data = JSON.parse(txt);
          if (data && Array.isArray(data.books)) data.books.forEach(b => { b.id = uid(); DB.books.push(b); });
        } catch(e){ toast("That backup file could not be read"); }
        return;
      }
      const { clean, ranges } = extractMarks(txt);
      const hs = rangesToHighlights(parse(clean), ranges, "revisit");
      const h1 = /^#\s+(.+)$/m.exec(clean), base = name.replace(/\.(md|markdown|txt)$/i, "");
      chapters.push({ id: uid(), title: (h1 ? h1[1] : base).trim(), source: clean, highlights: hs, created: Date.now(), updated: Date.now() });
      names.push(base);
    });
    const mk = (title, chs) => DB.books.push({ id: uid(), title, chapters: chs, created: Date.now(), updated: Date.now() });
    const finish = msg => { normalizeBooks(); save(); draw(); toast(msg); };
    const n = chapters.length;
    if (!n) return finish(items.length ? "Backup imported" : "Nothing to import");
    const b = target && DB.books.find(x => x.id === target);
    if (b){ b.chapters.push(...chapters); b.updated = Date.now(); return finish(`Added ${n} ${n === 1 ? "chapter" : "chapters"}`); }
    if (n === 1){ mk(chapters[0].title, chapters); return finish("Added 1 book"); }
    const guess = guessTitle(names, chapters[0].title);
    openSheet(`<h2>${n} files</h2>
      <input class="field" id="bkT" value="${esc(guess)}" style="margin-top:12px" aria-label="Book title">
      <div class="sheetrow"><button class="btn" id="sep">${n} separate books</button><button class="btn primary" id="one">One book, ${n} chapters</button></div>`);
    $("#one").onclick = () => { const t = $("#bkT").value.trim() || guess; closeSheet(); mk(t, chapters); finish(`Added “${t}”, ${n} chapters`); };
    $("#sep").onclick = () => { closeSheet(); chapters.forEach(c => mk(c.title, [c])); finish(`Added ${n} books`); };
  });
}

/* ============================================================
   re-anchor marks after an edit
   ============================================================ */
function reanchor(bk, newSrc){
  const doc = parse(newSrc);
  const kept = [];
  let lost = 0;
  (bk.highlights||[]).forEach(h => {
    const target = (h.text||"").split(/\s+/).filter(Boolean);
    if (!target.length) return;
    let found = null;
    for (let bi = 0; bi < doc.blocks.length && !found; bi++){
      const ws = doc.blocks[bi].words;
      for (let i = 0; i + target.length <= ws.length; i++){
        let ok = true;
        for (let j = 0; j < target.length; j++) if (ws[i+j].text !== target[j]){ ok = false; break; }
        if (ok){ found = { b: bi, s: i, e: i + target.length - 1 }; break; }
      }
    }
    if (found) kept.push({ ...h, ...found }); else lost++;
  });
  bk.highlights = kept;
  return lost;
}

function hashStr(s){ let h = 0; for (const c of s) h = (h*31 + c.charCodeAt(0)) >>> 0; return h; }

const touched = b => Math.max(b.updated||0, ...b.chapters.map(c => c.updated||0));

function drawReader(){

  document.documentElement.style.setProperty("--read", DB.settings.read + "px");

  $("#body").querySelectorAll(".w").forEach(el => {
    el.onclick = () => {
      if (el.dataset.h) markSheet(el.dataset.h);
      else addMark(+el.dataset.b, +el.dataset.w, +el.dataset.s);
    };
  });
}

function drawMarks(){
  const bk = book();
  $("#title").textContent = "Marks";
  $("#navBtn").hidden = false; $("#marksBtn").hidden = true; $("#menuBtn").hidden = false;
  $("#dock").hidden = true;

  const hs = [...(bk.highlights||[])].sort((a,b) => a.b - b.b || a.s - b.s);
  const count = t => hs.filter(h => h.tag === t).length;
  const tally = `<div class="tally">${Object.entries(TAGS).map(([k,v]) =>
    `<span><i class="dot" style="background:${v.css}"></i>${count(k)} ${v.label.toLowerCase()}</span>`).join("")}</div>`;

  $("#body").innerHTML = `<div class="pad">
    <div class="lampmark">${esc(bk.title)}</div>
    ${tally}
    ${hs.length ? `<div class="marks">${hs.map(h => `
      <button class="mark" data-go="${h.id}">
        <i class="bar-l" style="background:${TAGS[h.tag] ? TAGS[h.tag].css : "var(--amber)"}"></i>
        <span><span class="txt">${esc(h.text)}</span>
        ${h.note ? `<span class="note">${esc(h.note)}</span>` : ""}</span>
      </button>`).join("")}</div>`
      : `<div class="empty"><p>Nothing marked yet.</p><span>Open the book and tap a word, a sentence or a paragraph while you read.</span></div>`}
    <div class="rowbtns">
      <button class="btn" id="exportMarks">
        <svg viewBox="0 0 24 24"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a1 1 0 001 1h14a1 1 0 001-1v-2"/></svg>Export marks list</button>
    </div></div>`;

  $("#body").querySelectorAll("[data-go]").forEach(el => el.onclick = () => {
    const id = el.dataset.go;
    view = "reader"; draw();
    const t = $("#body").querySelector(`[data-h="${id}"]`);
    if (t){ t.scrollIntoView({ block:"center", behavior:"smooth" }); t.classList.add("flash"); }
  });
  $("#exportMarks").onclick = () => deliver(`${slug(bk.title)}-marks.md`, marksDoc(bk));
}

function drawEditor(){
  const bk = book();
  $("#title").textContent = "Editing";
  $("#navBtn").hidden = false; $("#marksBtn").hidden = true; $("#menuBtn").hidden = true;
  $("#dock").hidden = true;
  $("#body").innerHTML = `
    <div class="hint">Plain markdown. <b># </b>title, <b>## </b>chapter, <b>*word*</b> for emphasis, <b>&gt; </b>for a quiet line. Marks re-attach to their words when you save.</div>
    <textarea class="editor" id="ed" spellcheck="true"></textarea>`;
  const ed = $("#ed");
  ed.value = bk.source;
  ed.oninput = () => { ed.style.height = "auto"; ed.style.height = ed.scrollHeight + "px"; };
  setTimeout(() => ed.oninput(), 0);
}

function commitEdit(){
  const bk = book(), ed = $("#ed"); if (!bk || !ed) return;
  const next = ed.value;
  if (next !== bk.source){
    const lost = reanchor(bk, next);
    bk.source = next;
    const h1 = /^#\s+(.+)$/m.exec(next);
    if (h1){ bk.title = h1[1].trim(); const pb = pbook(); if (pb.chapters.length === 1) pb.title = bk.title; }
    bk.updated = Date.now();
    save();
    toast(lost ? `Saved — ${lost} mark${lost===1?"":"s"} no longer matched the text` : "Saved");
  }
}

const SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M6 6l1.5 1.5M16.5 16.5L18 18M18 6l-1.5 1.5M7.5 16.5L6 18"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>';
function syncReadControls(){
  const day = DB.settings.theme === "day";
  document.documentElement.dataset.theme = day ? "day" : "night";
  document.querySelector('meta[name="theme-color"]').content = day ? "#ede2c9" : "#14151c";
  document.documentElement.style.setProperty("--read", DB.settings.read + "px");
  $("#szVal").textContent = DB.settings.read + " px";
  $("#themeBtn").innerHTML = (day ? MOON : SUN) + (day ? "Night" : "Day");
}

function syncDock(){
  const reading = view === "reader", open = DB.settings.dock !== false;
  $("#dock").hidden = !(reading && open);
  $("#dockShow").hidden = !(reading && !open);
}

function draw(){
  syncReadControls();
  $(".bar").style.display = view === "library" ? "none" : "";
  if (view === "library") drawLibrary();
  else if (view === "reader") drawReader();
  else if (view === "marks") drawMarks();
  else if (view === "editor") drawEditor();
  else if (view === "chapters") drawChapters();
  syncDock();
  $("#dock").querySelectorAll("[data-mode]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.mode === DB.settings.mode));
  $("#dock").querySelectorAll("[data-tag]").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.tag === DB.settings.tag));
}

/* ============================================================
   chrome wiring
   ============================================================ */
$("#navBtn").onclick = () => {
  if (view === "editor"){ commitEdit(); view = "reader"; }
  else if (view === "marks") view = "reader";
  else if (view === "reader" && pbook().chapters.length > 1) view = "chapters";
  else { view = "library"; bookId = null; }
  draw();
};
$("#marksBtn").onclick = () => { view = "marks"; draw(); };
$("#dockHide").onclick = () => { DB.settings.dock = false; save(); syncDock(); };
$("#dockShow").onclick = () => { DB.settings.dock = true; save(); syncDock(); };
const setSize = d => { DB.settings.read = Math.max(14, Math.min(34, DB.settings.read + d)); save(); syncReadControls(); };
$("#szDown").onclick = () => setSize(-2);
$("#szUp").onclick = () => setSize(2);
$("#themeBtn").onclick = () => { DB.settings.theme = DB.settings.theme === "day" ? "night" : "day"; save(); syncReadControls(); };

$("#dock").querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
  DB.settings.mode = b.dataset.mode; save(); draw();
});
$("#dock").querySelectorAll("[data-tag]").forEach(b => b.onclick = () => {
  DB.settings.tag = b.dataset.tag; save(); draw();
});

$("#menuBtn").onclick = () => {
  const pb = pbook(), bk = view === "reader" ? book() : null, multi = !!pb && pb.chapters.length > 1;
  const ico = d => `<svg viewBox="0 0 24 24">${d}</svg>`;
  openSheet(`<h2>${pb ? esc(pb.title) : "LampRead"}</h2>
    <div class="menu">
      ${bk ? `
      <button data-a="edit">${ico('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>')}<span>Edit text<small>Write or fix the story</small></span></button>
      <button data-a="exp-marks">${ico('<path d="M12 4v12m0 0l-4-4m4 4l4-4M4 18v2h16v-2"/>')}<span>Export ${multi ? "chapter" : "book"} with marks<small>Markdown, marks as inline comments</small></span></button>
      <button data-a="exp-clean">${ico('<path d="M7 4h7l5 5v11H7z"/><path d="M14 4v5h5"/>')}<span>Export ${multi ? "chapter" : "book"} clean<small>Just the story</small></span></button>` : ""}
      ${multi ? `<button data-a="exp-book">${ico('<path d="M4 5h6a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v12a2 2 0 012-2h6z"/>')}<span>Export whole book<small>All ${pb.chapters.length} chapters in one file, marks included</small></span></button>` : ""}
      ${pb ? `
      <button data-a="rename">${ico('<path d="M5 12h14"/><path d="M9 6h10M9 18h10"/>')}<span>Rename</span></button>
      <button data-a="del" class="danger">${ico('<path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/>')}<span>Delete book</span></button>` : ""}
      <button data-a="backup">${ico('<path d="M12 4v12m0 0l-4-4m4 4l4-4M4 18v2h16v-2"/>')}<span>Back up everything<small>One .json with all books and marks</small></span></button>
    </div>`);
  $("#sheet").querySelectorAll("[data-a]").forEach(el => el.onclick = () => {
    const a = el.dataset.a; closeSheet();
    if (a === "edit"){ view = "editor"; draw(); }
    const fn = bk && (multi ? `${slug(pb.title)}-${slug(bk.title)}` : slug(pb.title));
    if (a === "exp-book") deliver(`${slug(pb.title)}.md`, bookWithMarks(pb));
    if (a === "exp-marks") deliver(`${fn}.md`, withMarks(bk));
    if (a === "exp-clean") deliver(`${fn}-clean.md`, bk.source);
    if (a === "backup") deliver(`lampread-backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(DB,null,2), "application/json");
    if (a === "rename"){
      openSheet(`<h2>Rename</h2><input class="field" id="rn" value="${esc(pb.title)}" style="margin-top:12px">
        <div class="sheetrow"><button class="btn" id="rnc">Cancel</button><button class="btn primary" id="rno">Save</button></div>`);
      $("#rnc").onclick = closeSheet;
      $("#rno").onclick = () => { pb.title = $("#rn").value.trim() || pb.title; pb.updated = Date.now(); save(); closeSheet(); draw(); };
    }
    if (a === "del"){
      openSheet(`<h2>Delete “${esc(pb.title)}”?</h2>
        <div class="quote">Its marks go with it. Export first if you want to keep them.</div>
        <div class="sheetrow"><button class="btn" id="dc">Keep it</button><button class="btn danger" id="dd">Delete</button></div>`);
      $("#dc").onclick = closeSheet;
      $("#dd").onclick = () => {
        DB.books = DB.books.filter(x => x.id !== pb.id);
        bookId = null; view = "library"; save(); closeSheet(); draw(); toast("Deleted");
      };
    }
  });
};

$("#fileInput").onchange = e => { if (e.target.files.length) importFiles(e.target.files); e.target.value = ""; };

document.addEventListener("visibilitychange", () => { if (document.hidden && view === "editor") commitEdit(); });
window.addEventListener("pagehide", () => { if (view === "editor") commitEdit(); });

/* ---------- boot ---------- */
(async function(){
  const raw = await Store.get(KEY);
  if (raw){ try { DB = Object.assign(DB, JSON.parse(raw)); } catch(e){} }
  if (!DB.settings) DB.settings = { theme:"night", read:20, mode:"word", tag:"revisit" };
  normalizeBooks();
  if (!DB.books.length){
    DB.books.push({ id:uid(), title:"The Night the Lamp Went Out", source:SAMPLE,
                    highlights:[], created:Date.now(), updated:Date.now() });
    await save();
  }
  normalizeBooks(); draw();
})();
</script>
</body>
</html>
